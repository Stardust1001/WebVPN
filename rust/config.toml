# Rust 版 WebVPN 配置（独立于 Node 版的根目录 config.js，两者互不读取、互不影响）
# 字段为 snake_case；给前端的配置 JSON 才是 camelCase（由代码自动转换）
# 未列出的字段会用 src/config.rs 中 Config::default() 的默认值，建议显式写全以便排查

# 是否启用 HTTPS 服务（需提供 ssl/server.key 与 ssl/server.pem）
https_enabled = true
# HTTP 服务端口
port = 80
# HTTPS 服务端口
https_port = 443
# WebVPN 主站地址，访问其他网站都从这个网址进行转换
# （本地测试配 hosts：127.0.0.1 www.webvpn.info）
site = "http://www.webvpn.info"
# 工作进程数（与 Node 版 numProcesses 保持一致；Rust 版用 tokio 多线程，此字段仅保留兼容，实际无效）
num_processes = 1
# 是否启用缓存，把静态资源缓存到本地文件夹以加速后续访问
cache = false
# 缓存文件夹地址
cache_dir = "cache"
# 会话共享持久化目录（share sessions 的 cookie/authorization/clientCache 落盘于此）
sessions_dir = "sessions"
# public 前端资源目录（rust 目录运行时相对上级）
public_dir = "../public"
# SSL 证书目录
ssl_dir = "../ssl"
# 是否把 intercept.js 内部 log 日志输出到浏览器控制台（默认关闭，避免污染目标网站的 console）
debug_log = false
# 是否禁止一切跳转
disable_jump = false
# 是否在跳转前询问用户
confirm_jump = false
# 是否抹掉 sourceMappingURL
disable_source_map = true
# 是否启用插件（public/plugins.js 媒体下载等）
enable_plugins = true
# 是否开启调试（注入 vConsole）
debug = false
# 是否禁用浏览器开发者工具
# 注意：disable-devtool 库在 CDP 驱动的浏览器下可能会误判并清空页面跳 about:blank
disable_devtools = false
# AST 改写模式（原名 rewrite_this，已改名 ast_rewrite——它控制的早已不只是 this 改写，
# 而是整套服务端 JS 改写架构的选择）：
#   false = 旧模式（默认）：custom_response 用字符串硬替换（type="module"→"mod"、
#           抹 use strict、正则 location.xxx→location.__xxx__、正则 with(this)），
#           refactor_js_scope_code 对每段 JS 包裹 with(__context_proxy__) + hoisting；
#           浏览器端不加载 rewrite.wasm，运行时动态注入的 module script 转 type="mod"
#   true  = AST 模式：custom_response 用 oxc 解析整份响应，精准改写 this 与
#           7 个作用域标识符（location/window/self/globalThis/document/parent/top）
#           及 eval 别名调用；refactor_js_scope_code 不包裹 with；保留 ESM/use strict；
#           浏览器端同步加载 public/rewrite.wasm 改写 eval/Function/定时器字符串代码
ast_rewrite = false
# 上游请求超时（秒）
request_timeout = 60
# 上游 TCP 连接超时（秒）：对端 SYN 黑洞时避免等内核 keepinit（macOS 默认 75s）才报错
connect_timeout = 10
# 域名编码模式 original（多级子域名，支持 cookie domain=）| underline（压平单段，不支持）
domain_mode = "underline"

# 单域名代理映射：无法配置泛解析 DNS 时，用单个二级域名代理指定网站
# 访问 http://baidu.webvpn.info/ 即代理 www.baidu.com
# 注意：被代理网站若引用第三方资源域名，第三方域名也要在此登记
# 通配符模式（domainMode: 'underline' 时）：key 与 value 都按 '*' 切段且段数一致，逐段配对，可缩短超长域名 (DNS 63字符限制)
# 比如：'wave-*dashcdn': 'mx7ba9zy4tvjtdjkzj1em8ecwh8dbg61-*.builds.wavedashcdn.com'：
#   mx7ba9zy4tvjtdjkzj1em8ecwh8dbg61-abc123.builds.wavedashcdn.com -> wave-abc123dashcdn.webvpn.info
[subdomains]
baidu = "www.baidu.com"
im = "im.qq.com"
"wave-*dashcdn" = "mx7ba9zy4tvjtdjkzj1em8ecwh8dbg61-*.builds.wavedashcdn.com"
