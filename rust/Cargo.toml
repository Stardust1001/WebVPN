[package]
name = "webvpn"
version = "0.8.0"
edition = "2024"
description = "WebVPN - proxy third-party website (Rust implementation)"
license = "MIT"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
# HTTP server
axum = { version = "0.8", features = ["ws", "macros"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
# HTTP client (manual redirect, TLS, streaming)
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
# TLS for HTTPS server
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
rustls-pki-types = { version = "1", features = ["alloc"] }
# WebSocket
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.26"
futures-util = "0.3"
# Charset decoding
encoding_rs = "0.8"
# URL parsing
url = "2"
# Regex
regex = "1"
once_cell = "1"
# Logging
env_logger = "0.11"
log = "0.4"
# Misc
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
bytes = "1"
percent-encoding = "2"
flate2 = "1"
zstd = "0.13"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
